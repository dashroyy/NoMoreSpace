<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ruler of the Galaxy</title>
    <meta name="description" content="A dice-chucking brawl for 2-6 friends online. Giant contenders fight over the Galactic Core." />
    <meta property="og:title" content="Ruler of the Galaxy" />
    <meta property="og:description" content="Roll, blast your rivals and hold the Omni-Throne. A 3D dice battle for 2-6 players, free in your browser." />
    <meta name="theme-color" content="#070913" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='40' rx='29' ry='8' fill='none' stroke='%234fe8ff' stroke-width='4' transform='rotate(-12 32 40)'/%3E%3Ccircle cx='32' cy='40' r='13' fill='%23ffbf3a'/%3E%3Cpath d='M17 27 15 9l9 8 8-13 8 13 9-8-2 18z' fill='%23ffcc4d' stroke='%236b3a00' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/ruler.css" />
    <link rel="stylesheet" href="/css/ruler-menus.css" />
    <script type="importmap">
      { "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three-addons/" } }
    </script>
  </head>
  <body class="on-home">
    <!-- the galaxy: one 3D scene behind every screen -->
    <div id="stage" aria-hidden="true"></div>
    <div id="labels" aria-hidden="true"></div>
    <div id="app">
      <section id="screen-home" class="screen"></section>
      <section id="screen-lobby" class="screen" hidden></section>
      <section id="screen-game" class="screen" hidden></section>
    </div>
    <div id="layer-fx" class="layer-fx" aria-hidden="true"></div>
    <div id="layer-prompt" class="layer-prompt"></div>
    <div id="layer-modal" class="layer-modal" hidden></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="problem" class="problem" role="alert"></div>
    <div id="warp" class="warp" aria-hidden="true"></div>

    <!-- the start screen: up before any script, so there is something to look at while the 3D engine downloads -->
    <div id="splash" class="splash">
      <div class="splash-inner">
        <div class="logo-lockup">
          <svg class="emblem" viewBox="0 0 120 100" aria-hidden="true">
            <path d="M14 30l2.2 4.8L21 37l-4.8 2.2L14 44l-2.2-4.8L7 37l4.8-2.2zM106 18l1.6 3.4 3.4 1.6-3.4 1.6-1.6 3.4-1.6-3.4-3.4-1.6 3.4-1.6z" fill="#fff6d6" />
            <ellipse cx="60" cy="66" rx="55" ry="13" fill="none" stroke="#4fe8ff" stroke-width="3.5" transform="rotate(-12 60 66)" opacity="0.55" />
            <circle cx="60" cy="66" r="22" fill="#ffb21a" stroke="#6b3a00" stroke-width="2.5" />
            <circle cx="54" cy="60" r="13" fill="#ffd66b" />
            <circle cx="50" cy="56" r="5" fill="#fff1c2" />
            <g transform="translate(60 66) rotate(-12)"><path d="M-55 0A55 13 0 0 0 55 0" fill="none" stroke="#4fe8ff" stroke-width="3.5" /></g>
            <path d="M36 42L31 14l15 12L60 5l14 21 15-12-5 28z" fill="#ffcc4d" stroke="#6b3a00" stroke-width="2.5" stroke-linejoin="round" />
            <path d="M46 26L60 5l14 21-7 8H53z" fill="#ffe08a" opacity="0.7" />
            <rect x="35" y="36" width="50" height="8" rx="2" fill="#ffb21a" stroke="#6b3a00" stroke-width="2.5" />
            <circle cx="60" cy="40" r="2.8" fill="#ff2a6d" /><circle cx="47" cy="40" r="2.1" fill="#00e5ff" /><circle cx="73" cy="40" r="2.1" fill="#00e5ff" />
            <circle cx="31" cy="14" r="3.2" fill="#fff1c2" stroke="#6b3a00" stroke-width="2" /><circle cx="60" cy="5" r="3.4" fill="#fff1c2" stroke="#6b3a00" stroke-width="2" /><circle cx="89" cy="14" r="3.2" fill="#fff1c2" stroke="#6b3a00" stroke-width="2" />
          </svg>
          <div class="wordmark"><span class="wm-1">RULER</span><span class="wm-2">of the galaxy</span></div>
        </div>
        <div class="splash-bar"><i id="splash-fill"></i></div>
        <div class="splash-status" id="splash-status">Loading the galaxy…</div>
        <button class="splash-press" id="splash-press" type="button" hidden>Press any key</button>
      </div>
      <div class="splash-tip" id="splash-tip"></div>
      <div class="splash-foot">2–6 players · online with friends · robots fill empty seats</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/ruler/main.js"></script>
  </body>
</html>
