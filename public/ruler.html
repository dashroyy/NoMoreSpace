<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ruler of the Galaxy</title>
    <meta name="description" content="A dice-chucking brawl for 2-6 friends online. Giant contenders fight over the Galactic Core." />
    <meta name="theme-color" content="#070913" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='13' fill='%23ffb800'/%3E%3Cellipse cx='32' cy='32' rx='29' ry='9' fill='none' stroke='%2300f0ff' stroke-width='4' transform='rotate(-25 32 32)'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/ruler.css" />
    <script type="importmap">
      { "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three-addons/" } }
    </script>
  </head>
  <body class="on-home">
    <!-- the galaxy: one 3D scene behind every screen -->
    <div id="stage" aria-hidden="true"></div>
    <div id="labels" aria-hidden="true"></div>
    <div id="app">
      <section id="screen-home" class="screen"></section>
      <section id="screen-lobby" class="screen" hidden></section>
      <section id="screen-game" class="screen" hidden></section>
    </div>
    <div id="layer-fx" class="layer-fx" aria-hidden="true"></div>
    <div id="layer-prompt" class="layer-prompt"></div>
    <div id="layer-modal" class="layer-modal" hidden></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="problem" class="problem" role="alert"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/ruler/main.js"></script>
  </body>
</html>
