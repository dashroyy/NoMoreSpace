<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starcade: No More Space, Phase to Space, Ruler of the Galaxy, Star Bonanza &amp; Star Charters</title>
    <meta name="description" content="Free online games to play with friends: No More Space (a spooky space social-deduction game), Phase to Space (a space card battler) Ruler of the Galaxy (a 3D dice brawl), Star Bonanza (a silly space-farm trading card game) and Star Charters (a space tile-laying game)." />
    <meta name="theme-color" content="#05060f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sixtyfour&family=Silkscreen&family=VT323&family=Doto:wght@700;900&family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/hub.css" />
    <link rel="stylesheet" href="/css/icons.css" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/typography.css" />
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>

    <main class="hub">
      <header class="hub-head">
        <h1 class="logo">STAR<span>CADE</span></h1>
        <form class="join" id="join" autocomplete="off">
          <input id="hub-code" maxlength="4" placeholder="CODE" autocapitalize="characters" spellcheck="false" aria-label="Join with a four-letter code" />
          <button id="hub-join" type="submit">Join ▸</button>
          <div id="hub-msg" class="msg" role="status"></div>
        </form>
      </header>

      <!-- a game you were in a moment ago -->
      <section id="resume" class="resume" hidden></section>

      <section class="stage" aria-roledescription="carousel" aria-label="Choose a game">
        <div class="games" id="games">
          <a class="game nms" href="/nms" id="g-nms" data-game="nms" aria-label="Play No More Space">
            <div class="shots">
              <video class="clip" src="/assets/hub/nms.webm" poster="/assets/hub/nms-1.webp" muted loop playsinline preload="none" disablepictureinpicture aria-hidden="true"></video>
            </div>
            <div class="cap">
              <div class="title"><div class="kind">🎭 Social deduction · 3–15</div><h2>No More Space</h2></div>
              <div class="foot"><span class="live" data-live="nms">&nbsp;</span><span class="go">PLAY ▸</span></div>
            </div>
          </a>
          <a class="game pts" href="/phase" id="g-pts" data-game="phase" aria-label="Play Phase to Space">
            <div class="shots">
              <video class="clip" src="/assets/hub/phase.webm" poster="/assets/hub/phase-1.webp" muted loop playsinline preload="none" disablepictureinpicture aria-hidden="true"></video>
            </div>
            <div class="cap">
              <div class="title"><div class="kind">🃏 Card battler · 2–6</div><h2>Phase to Space</h2></div>
              <div class="foot"><span class="live" data-live="phase">&nbsp;</span><span class="go">PLAY ▸</span></div>
            </div>
          </a>
          <a class="game rotg" href="/ruler" id="g-rotg" data-game="ruler" aria-label="Play Ruler of the Galaxy">
            <div class="shots">
              <video class="clip" src="/assets/hub/ruler.webm" poster="/assets/hub/ruler-1.webp" muted loop playsinline preload="none" disablepictureinpicture aria-hidden="true"></video>
            </div>
            <div class="cap">
              <div class="title"><div class="kind">🎲 Dice brawl · 2–6</div><h2>Ruler of the Galaxy</h2></div>
              <div class="foot"><span class="live" data-live="ruler">&nbsp;</span><span class="go">PLAY ▸</span></div>
            </div>
          </a>
          <a class="game sbz" href="/bonanza" id="g-sbz" data-game="bonanza" aria-label="Play Star Bonanza">
            <div class="shots">
              <video class="clip" src="/assets/hub/bonanza.webm" poster="/assets/hub/bonanza-1.webp" muted loop playsinline preload="none" disablepictureinpicture aria-hidden="true"></video>
            </div>
            <div class="cap">
              <div class="title"><div class="kind">🌟 Trading cards · 3–7</div><h2>Star Bonanza</h2></div>
              <div class="foot"><span class="live" data-live="bonanza">&nbsp;</span><span class="go">PLAY ▸</span></div>
            </div>
          </a>
          <a class="game sch" href="/charters" id="g-sch" data-game="charters" aria-label="Play Star Charters">
            <div class="shots">
              <video class="clip" src="/assets/hub/charters.webm" poster="/assets/hub/charters-1.webp" muted loop playsinline preload="none" disablepictureinpicture aria-hidden="true"></video>
            </div>
            <div class="cap">
              <div class="title"><div class="kind">🧩 Tile laying · 2–5</div><h2>Star Charters</h2></div>
              <div class="foot"><span class="live" data-live="charters">&nbsp;</span><span class="go">PLAY ▸</span></div>
            </div>
          </a>
        </div>
        <button class="nav prev" type="button" aria-label="Previous game"></button>
        <button class="nav next" type="button" aria-label="Next game"></button>
        <div class="dots" id="dots" role="tablist" aria-label="Games"></div>
      </section>
    </main>

    <script type="module" src="/js/hub.js"></script>
  </body>
</html>
