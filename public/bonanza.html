<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Star Bonanza</title>
    <meta name="description" content="Grow silly star buddies on your space farm, swap them with your friends and cash them in for coins. A cartoon card game for 3-7 players, free in your browser." />
    <meta property="og:title" content="Star Bonanza" />
    <meta property="og:description" content="Plant grumpy red dwarfs and party-DJ pulsars, trade like mad with everyone at once, and harvest the most coins. A cartoon space-farm card game." />
    <meta name="theme-color" content="#2e1a73" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 5l8 17 18 2-13 13 4 19-17-10-17 10 4-19L6 24l18-2z' fill='%23ffd23f' stroke='%232d1b4e' stroke-width='4' stroke-linejoin='round'/%3E%3Ccircle cx='26' cy='31' r='3' fill='%232d1b4e'/%3E%3Ccircle cx='38' cy='31' r='3' fill='%232d1b4e'/%3E%3Cpath d='M26 39q6 5 12 0' fill='none' stroke='%232d1b4e' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/bonanza.css" />
    <script type="importmap">
      { "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three-addons/" } }
    </script>
  </head>
  <body class="on-home">
    <!-- the space farm: one 3D scene behind every screen -->
    <div id="stage" aria-hidden="true"></div>
    <div id="labels" aria-hidden="true"></div>
    <div id="app">
      <section id="screen-home" class="screen"></section>
      <section id="screen-lobby" class="screen" hidden></section>
      <section id="screen-game" class="screen" hidden></section>
    </div>
    <div id="layer-fx" class="layer-fx" aria-hidden="true"></div>
    <div id="layer-prompt" class="layer-prompt"></div>
    <div id="layer-modal" class="layer-modal" hidden></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="problem" class="problem" role="alert"></div>
    <div id="warp" class="warp" aria-hidden="true"></div>

    <!-- the start screen: up before any script, so there is something to look at while the 3D engine downloads -->
    <div id="splash" class="splash">
      <div class="splash-inner">
        <div class="logo-lockup">
          <svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
            <path d="M60 8l14 30 32 4-23 23 6 33-29-16-29 16 6-33L14 42l32-4z" fill="#ffd23f" stroke="#2d1b4e" stroke-width="7" stroke-linejoin="round" />
            <path d="M60 22l9 20 21 3" fill="none" stroke="#fff4b0" stroke-width="5" stroke-linecap="round" opacity="0.8" />
            <ellipse cx="48" cy="60" rx="6" ry="8" fill="#2d1b4e" /><ellipse cx="72" cy="60" rx="6" ry="8" fill="#2d1b4e" />
            <circle cx="46" cy="57" r="2.2" fill="#fff" /><circle cx="70" cy="57" r="2.2" fill="#fff" />
            <path d="M50 74q10 9 20 0" fill="#2d1b4e" stroke="#2d1b4e" stroke-width="3" stroke-linejoin="round" />
            <ellipse cx="38" cy="72" rx="6" ry="3.5" fill="#ff8fb8" /><ellipse cx="82" cy="72" rx="6" ry="3.5" fill="#ff8fb8" />
          </svg>
          <div class="wordmark"><span class="wm-1">Star</span><span class="wm-2">Bonanza</span></div>
        </div>
        <div class="splash-bar"><i id="splash-fill"></i></div>
        <div class="splash-status" id="splash-status">Watering the stars…</div>
        <button class="splash-press" id="splash-press" type="button" hidden>Press any key</button>
      </div>
      <div class="splash-tip" id="splash-tip"></div>
      <div class="splash-foot">3–7 farmers · play with friends online · robots fill empty seats</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/bonanza/main.js"></script>
  </body>
</html>
