# Publishes the game to your server whenever `main` changes (after tests pass).
# It copies the code over SSH, installs dependencies and restarts the game.
#
# Set these in GitHub: repo → Settings → Secrets and variables → Actions
#   DEPLOY_HOST      server IP address or hostname, e.g. 203.0.113.10
#   DEPLOY_USER      SSH user, e.g. nomorespace
#   DEPLOY_SSH_KEY   the PRIVATE key that matches a public key on the server
#   DEPLOY_PATH      folder on the server, e.g. /home/nomorespace/app
# Optional:
#   DEPLOY_PORT          SSH port (default 22)
#   DEPLOY_RESTART_CMD   command that restarts the game
#                        (default: sudo systemctl restart nomorespace)
#
# Until DEPLOY_HOST is set, this workflow skips itself, so it is safe to keep.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

concurrency: deploy

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_SERVER: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Skip if no server is configured yet
        if: env.HAS_SERVER != 'true'
        run: echo "::notice::DEPLOY_HOST secret not set, skipping deploy. See docs/HOSTING_GUIDE.md."

      - uses: actions/checkout@v4
        if: env.HAS_SERVER == 'true'

      - name: Set up SSH key
        if: env.HAS_SERVER == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy files to the server
        if: env.HAS_SERVER == 'true'
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.github' --exclude 'test' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT || 22 }}" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Install and restart
        if: env.HAS_SERVER == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || 22 }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && npm ci --omit=dev && ${{ secrets.DEPLOY_RESTART_CMD || 'sudo systemctl restart nomorespace' }}"
